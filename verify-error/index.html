<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Verificatie mislukt — Nestd</title>
  <meta name="theme-color" content="#08080a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--brand:#ff385c;--brand2:#ff6a5b}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#08080a;color:#f4f4f6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
    body::before,body::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none}
    body::before{width:520px;height:520px;top:-160px;right:-120px;background:radial-gradient(circle,rgba(255,56,92,.5),transparent 70%)}
    body::after{width:460px;height:460px;bottom:-160px;left:-140px;background:radial-gradient(circle,rgba(120,90,255,.3),transparent 70%)}
    .card{position:relative;z-index:1;width:100%;max-width:420px;text-align:center;padding:2.4rem 2rem;border-radius:28px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);box-shadow:0 24px 70px rgba(0,0,0,.55);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
    .logo{width:60px;height:60px;border-radius:15px;margin:0 auto 1.4rem}
    .badge-icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;margin:0 auto 1.25rem}
    .badge-warn{background:rgba(245,158,11,.15);color:#f59e0b}
    h1{font-size:1.6rem;font-weight:600;letter-spacing:-.02em;margin-bottom:.5rem}
    .subtitle{color:#a4a4ad;font-size:.95rem;line-height:1.55;margin-bottom:1.8rem}
    .btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:.9rem 1.6rem;border-radius:999px;font:inherit;font-weight:600;font-size:1rem;border:0;cursor:pointer;text-decoration:none;transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .3s;margin-bottom:.8rem}
    .btn:active{transform:scale(.97)}
    .btn-primary{color:#fff;background:linear-gradient(180deg,var(--brand2),var(--brand));box-shadow:0 0 0 1px rgba(255,56,92,.35),0 14px 40px rgba(255,56,92,.3)}
    .btn-secondary{color:#f4f4f6;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
    @media (prefers-reduced-motion:reduce){.btn{transition:none}}
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="Nestd" class="logo">
    <div class="badge-icon badge-warn" aria-hidden="true">!</div>
    <h1 id="title">Verificatie mislukt</h1>
    <p class="subtitle" id="subtitle">We konden je e-mail niet bevestigen. Open de Nestd app en vraag een nieuwe verificatielink aan.</p>
    <a href="nestd://" class="btn btn-primary">Open Nestd</a>
    <a href="/" class="btn btn-secondary">Meer over Nestd</a>
  </div>
  <script>
    (function () {
      var reason = new URLSearchParams(window.location.search).get('reason');
      var copy = {
        expired: {
          title: 'Link verlopen',
          subtitle: 'Deze verificatielink is verlopen. Open de Nestd app en vraag een nieuwe link aan.'
        },
        invalid: {
          title: 'Ongeldige link',
          subtitle: 'Deze verificatielink bestaat niet of is al ongeldig gemaakt. Vraag een nieuwe aan vanuit de Nestd app.'
        },
        missing: {
          title: 'Link onvolledig',
          subtitle: 'De verificatielink ontbreekt of is onvolledig. Vraag een nieuwe aan vanuit de Nestd app.'
        }
      };
      var picked = copy[reason];
      if (picked) {
        document.getElementById('title').textContent = picked.title;
        document.getElementById('subtitle').textContent = picked.subtitle;
      }
    })();
  </script>
</body>
</html>
