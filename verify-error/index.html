<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Verificatie mislukt — Nestd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a; color: #f5f5f5;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
    }
    .container { text-align: center; max-width: 420px; }
    .logo { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 1.5rem; }
    .icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 700;
      margin: 0 auto 1.25rem;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem; font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #a0a0a0; font-size: 0.95rem;
      margin-bottom: 2rem; line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 0.875rem 2rem;
      border-radius: 12px;
      font-size: 1rem; font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s, opacity 0.15s;
      cursor: pointer; border: none;
    }
    .btn:hover { transform: scale(1.02); }
    .btn-primary {
      background: linear-gradient(135deg, #FF385C, #ED1543);
      color: #fff; width: 100%; margin-bottom: 1rem;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #f5f5f5;
      border: 1px solid rgba(255,255,255,0.12);
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.png" alt="Nestd" class="logo">
    <div class="icon" aria-hidden="true">!</div>
    <h1 id="title">Verificatie mislukt</h1>
    <p class="subtitle" id="subtitle">We konden je e-mail niet bevestigen. Open de Nestd app en vraag een nieuwe verificatielink aan.</p>
    <a href="nestd://" class="btn btn-primary">Open Nestd</a>
    <a href="/" class="btn btn-secondary">Meer over Nestd</a>
  </div>
  <script>
    (function () {
      var reason = new URLSearchParams(window.location.search).get('reason');
      var copy = {
        expired: {
          title: 'Link verlopen',
          subtitle: 'Deze verificatielink is verlopen. Open de Nestd app en vraag een nieuwe link aan.'
        },
        invalid: {
          title: 'Ongeldige link',
          subtitle: 'Deze verificatielink bestaat niet of is al ongeldig gemaakt. Vraag een nieuwe aan vanuit de Nestd app.'
        },
        missing: {
          title: 'Link onvolledig',
          subtitle: 'De verificatielink ontbreekt of is onvolledig. Vraag een nieuwe aan vanuit de Nestd app.'
        }
      };
      var picked = copy[reason];
      if (picked) {
        document.getElementById('title').textContent = picked.title;
        document.getElementById('subtitle').textContent = picked.subtitle;
      }
    })();
  </script>
</body>
</html>
