<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>E-mail bevestigd — Nestd</title>
  <meta name="description" content="Je e-mailadres is bevestigd. Open de Nestd app.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container { text-align: center; max-width: 420px; }
    .logo { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 1.5rem; }
    .check {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 700;
      margin: 0 auto 1.25rem;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem; font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #a0a0a0; font-size: 0.95rem;
      margin-bottom: 2rem; line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 0.875rem 2rem;
      border-radius: 12px;
      font-size: 1rem; font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s, opacity 0.15s;
      cursor: pointer;
      border: none;
    }
    .btn:hover { transform: scale(1.02); }
    .btn-primary {
      background: linear-gradient(135deg, #FF385C, #ED1543);
      color: #fff;
      width: 100%;
      margin-bottom: 1rem;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #f5f5f5;
      border: 1px solid rgba(255,255,255,0.12);
      width: 100%;
    }
    .stores { margin-top: 2rem; display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .stores img { height: 44px; }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.png" alt="Nestd" class="logo">
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>E-mail bevestigd</h1>
    <p class="subtitle">Bedankt! Je e-mailadres is bevestigd. Je kunt nu terug naar de Nestd app.</p>
    <a href="nestd://" class="btn btn-primary">Open Nestd</a>
    <a href="/" class="btn btn-secondary">Meer over Nestd</a>
    <div class="stores">
      <a href="https://apps.apple.com/app/nestd/id6740091498" target="_blank" rel="noopener">
        <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store">
      </a>
    </div>
  </div>
</body>
</html>
