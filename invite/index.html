<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Je bent uitgenodigd — Nestd</title>
  <meta name="description" content="Je bent uitgenodigd om samen te zoeken op Nestd. Open de app of download hem gratis.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container { text-align: center; max-width: 420px; width: 100%; }
    .logo { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 1.5rem; }
    .badge {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(255, 56, 92, 0.15);
      color: #FF385C;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
    }
    .badge svg { width: 36px; height: 36px; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem; font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #a0a0a0; font-size: 0.95rem;
      margin-bottom: 2rem; line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 0.875rem 2rem;
      border-radius: 12px;
      font-size: 1rem; font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s, opacity 0.15s;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .btn:hover { transform: scale(1.02); }
    .btn-primary {
      background: linear-gradient(135deg, #FF385C, #ED1543);
      color: #fff;
      margin-bottom: 1rem;
    }
    .code-card {
      margin-top: 2rem;
      padding: 1.25rem;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .code-label { color: #a0a0a0; font-size: 0.8rem; margin-bottom: 0.5rem; }
    .code {
      font-size: 1.5rem; font-weight: 700; letter-spacing: 0.15em;
      color: #f5f5f5; font-variant-numeric: tabular-nums;
    }
    .code-hint { color: #808080; font-size: 0.8rem; margin-top: 0.5rem; line-height: 1.4; }
    .stores { margin-top: 1.5rem; display: flex; justify-content: center; }
    .stores img { height: 44px; }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.png" alt="Nestd" class="logo">
    <div class="badge" aria-hidden="true">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 10-4-4 4 4 0 004 4zm6 0a3 3 0 10-2.83-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
      </svg>
    </div>
    <h1>Je bent uitgenodigd</h1>
    <p class="subtitle">Iemand wil samen met jou een woning zoeken op Nestd. Open de app om de uitnodiging te accepteren, of download hem gratis.</p>

    <a href="#" id="open-app" class="btn btn-primary">Open in de Nestd app</a>

    <div class="stores">
      <a href="https://apps.apple.com/app/nestd/id6740091498" target="_blank" rel="noopener" aria-label="Download Nestd in de App Store">
        <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store">
      </a>
    </div>

    <div class="code-card" id="code-card" hidden>
      <div class="code-label">Jouw uitnodigingscode</div>
      <div class="code" id="code"></div>
      <div class="code-hint">Al de app? Voer deze code in bij <strong>Zoekpartner</strong> in de Nestd app.</div>
    </div>
  </div>

  <script>
    (function () {
      // Path is /invite/<code> (Vercel rewrites it to this page).
      var parts = location.pathname.split('/').filter(Boolean);
      var raw = parts.length > 1 ? parts[1] : '';
      var code = (raw || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 16);

      var openBtn = document.getElementById('open-app');
      if (code) {
        openBtn.setAttribute('href', 'nestd://invite/' + code);
        var card = document.getElementById('code-card');
        document.getElementById('code').textContent = code;
        card.hidden = false;
      } else {
        // No code — point at the App Store instead of a dead scheme link.
        openBtn.setAttribute('href', 'https://apps.apple.com/app/nestd/id6740091498');
        openBtn.setAttribute('target', '_blank');
        openBtn.setAttribute('rel', 'noopener');
      }
    })();
  </script>
</body>
</html>
