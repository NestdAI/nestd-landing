  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 420px;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #a0a0a0;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 0.875rem 2rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s, opacity 0.15s;
      cursor: pointer;
      border: none;
    }
    .btn:hover { transform: scale(1.02); }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      margin-bottom: 1rem;
      width: 100%;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #f5f5f5;
      border: 1px solid rgba(255,255,255,0.12);
      width: 100%;
    }
    .stores {
      margin-top: 2rem;
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .stores img { height: 44px; }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .redirect-msg { color: #a0a0a0; font-size: 0.85rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=1435983921187208&ev=PageView&noscript=1"></noscript>
  <div class="container">
    <img src="/logo.png" alt="Nestd" class="logo">
    <div id="redirecting">
      <div class="spinner"></div>
      <p class="redirect-msg">Opening Nestd app…</p>
    </div>
    <div id="fallback" style="display:none">
      <h1>Open Nestd</h1>
      <p class="subtitle">View your matches, browse listings, and chat with AI in the Nestd app.</p>
      <a id="open-app" href="https://nestd.nl/app" class="btn btn-primary">Open in Nestd</a>
      <a href="/" class="btn btn-secondary">Learn more about Nestd</a>
      <div class="stores">
        <a href="https://apps.apple.com/app/nestd/id6740091498" target="_blank">
          <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="App Store">
        </a>
      </div>
    </div>
  </div>
  <script>
    (function initMetaPixel() {
      var META_PIXEL_ID = window.NESTD_META_PIXEL_ID || (document.querySelector('meta[name="facebook-pixel-id"]') && document.querySelector('meta[name="facebook-pixel-id"]').content) || '1435983921187208';
      if (!META_PIXEL_ID || window.fbq) return;
      !function(f,b,e,v,n,t,s) {
        if (f.fbq) return;
        n = f.fbq = function() { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = true;
        n.version = '2.0';
        n.queue = [];
        t = b.createElement(e);
        t.async = true;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
      window.fbq('init', META_PIXEL_ID);
      window.fbq('track', 'PageView');
    })();
    (function initPostHogAnalytics() {
      var POSTHOG_KEY = window.NESTD_POSTHOG_KEY || (document.querySelector('meta[name="posthog-key"]') && document.querySelector('meta[name="posthog-key"]').content) || '';
      var POSTHOG_HOST = 'https://eu.i.posthog.com';
      var eventQueue = [];
      var analyticsReady = false;

      function safeUrl(value) {
        if (!value) return null;
        try {
          var parsed = new URL(value, window.location.origin);
          return parsed.origin + parsed.pathname;
        } catch (e) {
          return null;
        }
      }

      window.nestdAnalytics = {
        track: function(event, properties) {
          var params = new URLSearchParams(window.location.search);
          var payload = Object.assign({
            path: window.location.pathname,
            url: safeUrl(window.location.href),
            referrer: safeUrl(document.referrer),
            utm_source: params.get('utm_source'),
            utm_medium: params.get('utm_medium'),
            utm_campaign: params.get('utm_campaign'),
            utm_content: params.get('utm_content'),
            utm_term: params.get('utm_term')
          }, properties || {});
          if (analyticsReady && window.posthog && window.posthog.capture) {
            window.posthog.capture(event, payload);
            return;
          }
          if (POSTHOG_KEY) eventQueue.push([event, payload]);
        }
      };
      if (!POSTHOG_KEY) return;
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://eu-assets.i.posthog.com/static/array.js';
      script.onload = function() {
        window.posthog && window.posthog.init && window.posthog.init(POSTHOG_KEY, {
          api_host: POSTHOG_HOST,
          defaults: '2026-01-30',
          capture_pageview: false,
          autocapture: false,
          disable_session_recording: true,
          person_profiles: 'identified_only'
        });
        analyticsReady = true;
        window.nestdAnalytics.track('app_deeplink_viewed');
        while (eventQueue.length) {
          var queued = eventQueue.shift();
          window.posthog && window.posthog.capture && window.posthog.capture(queued[0], queued[1]);
        }
      };
      document.head.appendChild(script);
    })();

    (function() {
      var appUrl = 'https://nestd.nl/app';

      // Set the CTA link
      document.getElementById('open-app').href = appUrl;

      // Try to open the app via universal link, show fallback after timeout
      var fallbackTimer = setTimeout(function() {
        document.getElementById('redirecting').style.display = 'none';
        document.getElementById('fallback').style.display = 'block';
        window.nestdAnalytics && window.nestdAnalytics.track('app_deeplink_fallback_shown');
      }, 2500);

      // If the page becomes hidden (app opened), clear fallback
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          window.nestdAnalytics && window.nestdAnalytics.track('app_deeplink_opened');
          clearTimeout(fallbackTimer);
        }
      });

      // Attempt redirect
      window.location.href = appUrl;
    })();
  </script>
</body>
</html>
