<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin | Nestd</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="pages.css">
  <style>
    body { min-height: 100vh; }

    /* ── Login Screen ── */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .login-screen::before {
      content: '';
      position: absolute;
      top: 40%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(255,56,92,.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      position: relative;
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 40px;
    }

    .login-logo img {
      height: 48px;
      width: 48px;
      border-radius: 12px;
    }

    .login-logo span {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      color: var(--gray);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--light);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s;
    }
    .form-input::placeholder { color: #555; }
    .form-input:focus { border-color: var(--primary); }

    .form-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--primary);
      color: #fff;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s, opacity .2s;
      margin-top: 8px;
    }
    .form-btn:hover { opacity: .9; transform: translateY(-1px); }
    .form-btn:active { transform: translateY(0); }

    .form-error {
      text-align: center;
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--primary);
      min-height: 1.2em;
    }

    /* ── Admin Dashboard ── */
    .admin-screen { display: none; }
    .admin-screen.visible { display: block; }

    .admin-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10,10,10,.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
      padding: 16px 24px;
    }

    .admin-header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-brand img {
      height: 32px;
      width: 32px;
      border-radius: 8px;
    }

    .admin-brand span {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 500;
    }

    .admin-header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .admin-email {
      font-size: 0.8rem;
      color: var(--gray);
    }

    .btn-outline {
      padding: 8px 20px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--light);
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .btn-outline:hover {
      background: rgba(255,255,255,.06);
      border-color: rgba(255,255,255,.15);
    }

    /* ── Content ── */
    .admin-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .admin-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 32px;
    }

    .admin-title em {
      font-style: italic;
      color: var(--primary);
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: 2.4rem;
      font-weight: 600;
      line-height: 1;
    }

    .stat-value.primary { color: var(--primary); }
    .stat-value.success { color: #34d399; }

    /* Table */
    .table-wrap {
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      overflow: hidden;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-light);
    }

    .table-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 500;
    }

    .refresh-btn {
      background: none;
      border: none;
      color: var(--gray);
      font-family: var(--font-body);
      font-size: 0.85rem;
      cursor: pointer;
      transition: color .2s;
    }
    .refresh-btn:hover { color: var(--light); }

    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      text-align: left;
      border-collapse: collapse;
    }

    thead tr {
      border-bottom: 1px solid var(--border-light);
    }

    th {
      padding: 12px 24px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    td {
      padding: 16px 24px;
      font-size: 0.9rem;
    }

    tbody tr {
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      transition: background .2s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,.02); }

    .td-gray { color: var(--gray); }
    .td-truncate {
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--gray);
    }
    .td-date {
      color: #555;
      white-space: nowrap;
      font-size: 0.85rem;
    }

    .status-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }
    .status-dot.unread { background: var(--primary); }
    .status-dot.read { background: #34d399; }

    .view-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-family: var(--font-body);
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity .2s;
      padding: 0;
    }
    .view-btn:hover { opacity: .7; }

    .empty-state {
      padding: 60px 24px;
      text-align: center;
      color: #555;
      font-size: 0.9rem;
    }

    .error-state {
      padding: 60px 24px;
      text-align: center;
      color: var(--primary);
      font-size: 0.9rem;
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 24px;
    }
    .modal-overlay.visible {
      display: flex;
    }

    .modal-card {
      background: #111;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 520px;
      width: 100%;
      padding: 32px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: var(--gray);
      font-size: 1.4rem;
      cursor: pointer;
      transition: color .2s;
    }
    .modal-close:hover { color: var(--light); }

    .modal-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .modal-field {
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .modal-field-label {
      color: var(--gray);
    }

    .modal-field-value {
      color: var(--light);
      font-weight: 500;
    }

    .modal-field a {
      color: var(--primary);
      text-decoration: none;
      transition: opacity .2s;
    }
    .modal-field a:hover { opacity: .8; }

    .modal-message-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-light);
    }

    .modal-message-text {
      color: rgba(255,255,255,.8);
      line-height: 1.7;
      font-size: 0.95rem;
      margin-top: 8px;
      white-space: pre-wrap;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }

    .modal-btn-primary {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--primary);
      color: #fff;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: opacity .2s;
    }
    .modal-btn-primary:hover { opacity: .9; }

    .modal-btn-secondary {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      color: var(--light);
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .modal-btn-secondary:hover {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.15);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: 1fr; }
      .admin-email { display: none; }
      th, td { padding: 12px 16px; }
      .td-truncate { max-width: 140px; }
      .modal-actions { flex-direction: column; }
    }

    @media (max-width: 480px) {
      .modal-card { padding: 24px; }
    }

    /* ── Utility ── */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <img src="logo.png" alt="Nestd">
        <span>Nestd Admin</span>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input class="form-input" id="login-email" type="email" placeholder="admin@nestd.nl" required/>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Wachtwoord</label>
          <input class="form-input" id="login-password" type="password" placeholder="********" required/>
        </div>
        <button type="submit" class="form-btn">Inloggen</button>
        <p id="login-error" class="form-error"></p>
      </form>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="admin-screen" class="admin-screen">
    <header class="admin-header">
      <div class="admin-header-inner">
        <div class="admin-brand">
          <img src="logo.png" alt="Nestd">
          <span>Nestd Admin</span>
        </div>
        <div class="admin-header-right">
          <span id="admin-email" class="admin-email"></span>
          <button id="logout-btn" class="btn-outline">Uitloggen</button>
        </div>
      </div>
    </header>

    <main class="admin-content">
      <h1 class="admin-title">Contact <em>berichten</em></h1>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Totaal</div>
          <div id="stat-total" class="stat-value">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Ongelezen</div>
          <div id="stat-unread" class="stat-value primary">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Gelezen</div>
          <div id="stat-read" class="stat-value success">-</div>
        </div>
      </div>

      <!-- Messages Table -->
      <div class="table-wrap">
        <div class="table-header">
          <span class="table-title">Berichten</span>
          <button id="refresh-btn" class="refresh-btn">Vernieuw</button>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Status</th>
                <th>Naam</th>
                <th>Email</th>
                <th>Bericht</th>
                <th>Datum</th>
                <th>Actie</th>
              </tr>
            </thead>
            <tbody id="messages-body">
              <tr><td colspan="6" class="empty-state">Laden...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Message Detail Modal -->
  <div id="message-modal" class="modal-overlay">
    <div class="modal-card">
      <button id="modal-close" class="modal-close">&times;</button>
      <div class="modal-title">Bericht details</div>
      <div class="modal-field">
        <span class="modal-field-label">Naam: </span>
        <span id="modal-name" class="modal-field-value"></span>
      </div>
      <div class="modal-field">
        <span class="modal-field-label">Email: </span>
        <a id="modal-email" href=""></a>
      </div>
      <div class="modal-field">
        <span class="modal-field-label">Datum: </span>
        <span id="modal-date" style="color: rgba(255,255,255,.6)"></span>
      </div>
      <div class="modal-message-section">
        <span class="modal-field-label">Bericht:</span>
        <p id="modal-message" class="modal-message-text"></p>
      </div>
      <div class="modal-actions">
        <a id="modal-reply" href="" class="modal-btn-primary">Beantwoord</a>
        <button id="modal-mark-read" class="modal-btn-secondary">Markeer als gelezen</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://uauoewczlexhbhvxcrjg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhdW9ld2N6bGV4aGJodnhjcmpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyODU4NjcsImV4cCI6MjA4Nzg2MTg2N30.IlegUIZl3Oj4V9V_aTc0hD24coo19clgYkNVyYQ7bJI';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginScreen = document.getElementById('login-screen');
const adminScreen = document.getElementById('admin-screen');

// Hardcoded admin allowlist
const ALLOWED_ADMINS = [
  'i_sadike@hotmail.com',
  'hicham_sadike@hotmail.com'
];

// Check existing session
async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session && ALLOWED_ADMINS.includes(session.user.email)) {
    showAdmin(session.user);
  } else if (session) {
    await supabase.auth.signOut();
  }
}
init();

// Login
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = '';

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    errorEl.textContent = 'Ongeldige inloggegevens.';
    return;
  }
  if (!ALLOWED_ADMINS.includes(data.user.email)) {
    await supabase.auth.signOut();
    errorEl.textContent = 'Je hebt geen toegang tot het admin panel.';
    return;
  }
  showAdmin(data.user);
});

// Logout
document.getElementById('logout-btn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  adminScreen.classList.remove('visible');
  loginScreen.classList.remove('hidden');
});

// Show admin
function showAdmin(user) {
  loginScreen.classList.add('hidden');
  adminScreen.classList.add('visible');
  document.getElementById('admin-email').textContent = user.email;
  loadMessages();
}

// Load messages
async function loadMessages() {
  const { data, error } = await supabase
    .from('contact_messages')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    document.getElementById('messages-body').innerHTML =
      '<tr><td colspan="6" class="error-state">Fout bij laden van berichten.</td></tr>';
    return;
  }

  const total = data.length;
  const unread = data.filter(m => !m.read).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-unread').textContent = unread;
  document.getElementById('stat-read').textContent = total - unread;

  if (total === 0) {
    document.getElementById('messages-body').innerHTML =
      '<tr><td colspan="6" class="empty-state">Nog geen berichten ontvangen.</td></tr>';
    return;
  }

  document.getElementById('messages-body').innerHTML = data.map(m => `
    <tr data-id="${m.id}">
      <td><span class="status-dot ${m.read ? 'read' : 'unread'}"></span></td>
      <td style="font-weight:500">${escHtml(m.name)}</td>
      <td class="td-gray">${escHtml(m.email)}</td>
      <td class="td-truncate">${escHtml(m.message)}</td>
      <td class="td-date">${formatDate(m.created_at)}</td>
      <td><button class="view-btn" data-id="${m.id}">Bekijk</button></td>
    </tr>
  `).join('');

  window._messages = data;

  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openModal(btn.dataset.id);
    });
  });

  document.querySelectorAll('#messages-body tr[data-id]').forEach(row => {
    row.addEventListener('click', () => openModal(row.dataset.id));
  });
}

// Modal
function openModal(id) {
  const m = window._messages.find(msg => msg.id === id);
  if (!m) return;
  document.getElementById('modal-name').textContent = m.name;
  document.getElementById('modal-email').textContent = m.email;
  document.getElementById('modal-email').href = 'mailto:' + m.email;
  document.getElementById('modal-date').textContent = new Date(m.created_at).toLocaleString('nl-NL');
  document.getElementById('modal-message').textContent = m.message;
  document.getElementById('modal-reply').href = 'mailto:' + m.email + '?subject=Re: Nestd Contact';
  document.getElementById('modal-mark-read').dataset.id = id;
  document.getElementById('modal-mark-read').textContent = m.read ? 'Markeer als ongelezen' : 'Markeer als gelezen';
  document.getElementById('message-modal').classList.add('visible');
}

document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('message-modal').classList.remove('visible');
});

document.getElementById('message-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('message-modal')) {
    document.getElementById('message-modal').classList.remove('visible');
  }
});

document.getElementById('modal-mark-read').addEventListener('click', async (e) => {
  const id = e.target.dataset.id;
  const m = window._messages.find(msg => msg.id === id);
  if (!m) return;
  await supabase.from('contact_messages').update({ read: !m.read }).eq('id', id);
  document.getElementById('message-modal').classList.remove('visible');
  loadMessages();
});

document.getElementById('refresh-btn').addEventListener('click', loadMessages);

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' }) +
    ' ' + d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
}
</script>
</body>
</html>
